[package]
name = "polyglot-stream-heal-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python PyO3 native extension bindings for polyglot-stream-heal"

[lib]
name = "polyglot_stream_heal"
crate-type = ["cdylib"]

[dependencies]
polyglot-stream-heal = { path = "../../crates/polyglot-stream-heal" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
serde_json = { workspace = true }
